set noparent
linelength=100
extensions=c,h

exclude_files=build/.*
exclude_files=subprojects/.*
exclude_files=protocols/.*-protocol\.(c|h)
exclude_files=protocols/.*-client-protocol\.h
exclude_files=src/theme/base_.*_svg_src\.h
exclude_files=examples/gui/resources\.cpp

root=include

filter=-build/c++11
filter=-build/c++14
filter=-build/c++tr1
filter=-build/header_guard
filter=-build/include
filter=-build/include_order
filter=-build/include_subdir
filter=-build/include_what_you_use
filter=-readability/casting
filter=-runtime/int
filter=-whitespace/braces
filter=-whitespace/indent
