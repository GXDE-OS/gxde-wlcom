name: Building Arch Linux Package
run-name: Building ${{ github.repository }} for Arch Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  archlinux:
    name: Arch Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: agners/archlinuxarm-arm64v8:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install packaging tools
        run: pacman -Syu --needed --noconfirm base-devel git sudo

      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Disable pacman sandbox on ArchLinux ARM container
        if: matrix.arch == 'aarch64'
        run: |
          if ! grep -q '^DisableSandbox$' /etc/pacman.conf; then
            sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          fi

      - name: Build Arch Linux package
        run: sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-${{ matrix.arch }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error
