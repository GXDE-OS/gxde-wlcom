name: Building Arch Linux Package
run-name: Building ${{ github.repository }} for Arch Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  archlinux:
    name: Arch Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: agners/archlinuxarm-arm64v8:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install packaging tools
        run: pacman -Syu --needed --noconfirm base-devel git sudo

      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch Linux package
        run: sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-${{ matrix.arch }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  archlinux32:
    name: Arch Linux 32 (i686)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install bootstrap tools
        run: pacman -Syu --needed --noconfirm base-devel curl git

      - name: Check out source
        uses: actions/checkout@v4

      - name: Bootstrap Arch Linux 32
        shell: bash
        run: |
          curl -fL \
            https://mirror.math.princeton.edu/pub/archlinux32/i686/core/archlinux32-keyring-20251214-1.0-any.pkg.tar.zst \
            -o /tmp/archlinux32-keyring.pkg.tar.zst
          echo "7600cd9ddabbbbb5643b0235646670d070a4848030fbe10c77939ea3aeee29a0  /tmp/archlinux32-keyring.pkg.tar.zst" \
            | sha256sum --check --strict

          cat > /tmp/pacman-keyring-bootstrap.conf <<'EOF'
          [options]
          Architecture = auto
          SigLevel = Never
          EOF
          pacman --config /tmp/pacman-keyring-bootstrap.conf \
            --upgrade --noconfirm /tmp/archlinux32-keyring.pkg.tar.zst
          pacman-key --populate archlinux32

          cat > /tmp/pacman-i686.conf <<'EOF'
          [options]
          Architecture = i686
          SigLevel = Required DatabaseOptional
          ParallelDownloads = 5

          [core]
          Server = https://mirror.math.princeton.edu/pub/archlinux32/$arch/$repo

          [extra]
          Server = https://mirror.math.princeton.edu/pub/archlinux32/$arch/$repo
          EOF

          install -d \
            /arch32/build \
            /arch32/etc/pacman.d \
            /arch32/usr/share/pacman/keyrings \
            /arch32/var/lib/pacman
          install -m644 /tmp/pacman-i686.conf /arch32/etc/pacman.conf
          cp -a /etc/pacman.d/gnupg /arch32/etc/pacman.d/
          cp -a /usr/share/pacman/keyrings/archlinux32* \
            /arch32/usr/share/pacman/keyrings/
          pacman --config /tmp/pacman-i686.conf --root /arch32 \
            --noconfirm --sync --refresh base base-devel git sudo
          cp -a "$GITHUB_WORKSPACE/." /arch32/build/
          rm -f /arch32/etc/resolv.conf
          cp /etc/resolv.conf /arch32/etc/resolv.conf

      - name: Build i686 package
        shell: bash
        run: |
          chroot /arch32 useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /arch32/etc/sudoers.d/builder
          chroot /arch32 chown -R builder:builder /build
          chroot /arch32 sudo -u builder bash -lc \
            'cd /build && makepkg --syncdeps --noconfirm --cleanbuild'
          cp /arch32/build/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-i686
          path: "*.pkg.tar.zst"
          if-no-files-found: error
