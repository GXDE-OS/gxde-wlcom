<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <!--
    Deepin DDE15-style window button sprites for wlcom fallback theme
    Layout: 3 rows (normal, hover, pressed) × 4 cols (minimize, maximize, restore, close)
    Each cell: 30×30, viewBox: 120×90
  -->

  <!-- Row 0: Normal state (no background rect) -->
  <!-- minimize_normal -->
  <svg x="0" y="0" width="30" height="30">
    <polygon fill="#303030" points="7.5,20 24,20 24.5,20 24.5,19 24,19 7.5,19 7,19 7,20"/>
  </svg>
  <!-- maximize_normal -->
  <svg x="30" y="0" width="30" height="30">
    <path fill="#303030" fill-rule="evenodd" d="M7,13.5 L7,9.5 L7,8 L8.6,8 L21.4,8 L23,8 L23,9.5 L23,13.5 L23,15 L21.4,15 L8.6,15 L7,15 L7,13.5 Z M8,14 L22,14 L22,9 L8,9 L8,14 Z"/>
  </svg>
  <!-- unmaximize_normal -->
  <svg x="60" y="0" width="30" height="30">
    <path fill="#303030" fill-rule="evenodd" d="M22,8 L15,8 L15,7 L23,7 L23,15 L22,15 L22,8 Z M7,14 L7,10.5 L7,9 L8.5,9 L12.5,9 L14,9 L14,10.5 L14,14 L14,15.5 L12.5,15.5 L8.5,15.5 L7,15.5 L7,14 Z M8,15 L13,15 L13,10 L8,10 L8,15 Z"/>
  </svg>
  <!-- close_normal -->
  <svg x="90" y="0" width="30" height="30">
    <polygon fill="#303030" points="15.19,15.72 12.8,18.11 12.53,18.37 12,17.84 12.27,17.57 14.66,15.19 12.27,12.8 12,12.53 12.53,12 12.8,12.27 15.19,14.66 17.57,12.27 17.84,12 18.37,12.53 18.11,12.8 15.72,15.19 18.11,17.57 18.37,17.84 17.84,18.37 17.57,18.11"/>
  </svg>

  <!-- Row 1: Hover state (background rect + icon, close gets orange) -->
  <!-- minimize_hover -->
  <svg x="0" y="30" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#636381" fill-opacity="0.1"/>
    <polygon fill="#303030" points="7.5,20 24,20 24.5,20 24.5,19 24,19 7.5,19 7,19 7,20"/>
  </svg>
  <!-- maximize_hover -->
  <svg x="30" y="30" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#636381" fill-opacity="0.1"/>
    <path fill="#303030" fill-rule="evenodd" d="M7,13.5 L7,9.5 L7,8 L8.6,8 L21.4,8 L23,8 L23,9.5 L23,13.5 L23,15 L21.4,15 L8.6,15 L7,15 L7,13.5 Z M8,14 L22,14 L22,9 L8,9 L8,14 Z"/>
  </svg>
  <!-- unmaximize_hover -->
  <svg x="60" y="30" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#636381" fill-opacity="0.1"/>
    <path fill="#303030" fill-rule="evenodd" d="M22,8 L15,8 L15,7 L23,7 L23,15 L22,15 L22,8 Z M7,14 L7,10.5 L7,9 L8.5,9 L12.5,9 L14,9 L14,10.5 L14,14 L14,15.5 L12.5,15.5 L8.5,15.5 L7,15.5 L7,14 Z M8,15 L13,15 L13,10 L8,10 L8,15 Z"/>
  </svg>
  <!-- close_hover (orange icon) -->
  <svg x="90" y="30" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#636381" fill-opacity="0.1"/>
    <polygon fill="#FF8500" points="15.19,15.72 12.8,18.11 12.53,18.37 12,17.84 12.27,17.57 14.66,15.19 12.27,12.8 12,12.53 12.53,12 12.8,12.27 15.19,14.66 17.57,12.27 17.84,12 18.37,12.53 18.11,12.8 15.72,15.19 18.11,17.57 18.37,17.84 17.84,18.37 17.57,18.11"/>
  </svg>

  <!-- Row 2: Pressed state (darker bg, blue icons, close gets pink) -->
  <!-- minimize_press -->
  <svg x="0" y="60" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#34344B" fill-opacity="0.1"/>
    <polygon fill="#2CA7F8" points="7.5,20 24,20 24.5,20 24.5,19 24,19 7.5,19 7,19 7,20"/>
  </svg>
  <!-- maximize_press -->
  <svg x="30" y="60" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#34344B" fill-opacity="0.1"/>
    <path fill="#2CA7F8" fill-rule="evenodd" d="M7,13.5 L7,9.5 L7,8 L8.6,8 L21.4,8 L23,8 L23,9.5 L23,13.5 L23,15 L21.4,15 L8.6,15 L7,15 L7,13.5 Z M8,14 L22,14 L22,9 L8,9 L8,14 Z"/>
  </svg>
  <!-- unmaximize_press -->
  <svg x="60" y="60" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#34344B" fill-opacity="0.1"/>
    <path fill="#2CA7F8" fill-rule="evenodd" d="M22,8 L15,8 L15,7 L23,7 L23,15 L22,15 L22,8 Z M7,14 L7,10.5 L7,9 L8.5,9 L12.5,9 L14,9 L14,10.5 L14,14 L14,15.5 L12.5,15.5 L8.5,15.5 L7,15.5 L7,14 Z M8,15 L13,15 L13,10 L8,10 L8,15 Z"/>
  </svg>
  <!-- close_press (pink icon) -->
  <svg x="90" y="60" width="30" height="30">
    <rect width="30" height="30" rx="6" fill="#34344B" fill-opacity="0.1"/>
    <polygon fill="#FF3763" points="15.19,15.72 12.8,18.11 12.53,18.37 12,17.84 12.27,17.57 14.66,15.19 12.27,12.8 12,12.53 12.53,12 12.8,12.27 15.19,14.66 17.57,12.27 17.84,12 18.37,12.53 18.11,12.8 15.72,15.19 18.11,17.57 18.37,17.84 17.84,18.37 17.57,18.11"/>
  </svg>
</svg>
