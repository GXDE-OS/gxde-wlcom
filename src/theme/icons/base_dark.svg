<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!--
    Window button sprite for wlcom fallback theme (dark)
    Artwork ported from deepin-chameleon theme 「云璃」 from GXDE source code
    using deepin/dark/icons/{minimize,maximize,unmaximize,close}_{normal,hover,press}.svg.

    Original icons licensed under CC0-1.0. See gxde-kwin/.reuse/dep5's 「#png svg」 section.
    SPDX-FileCopyrightText: 2018 - 2023 UnionTech Software Technology Co., Ltd.
    SPDX-FileCopyrightText: 2026 CharOfString
    SPDX-License-Identifier: CC0-1.0

    Layout: each cell 40x40, viewBox 160x120.
  -->

  <!-- Row 0: Normal state (no background), glyph white @ .6 -->
  <!-- minimize_normal -->
  <svg x="0" y="0" width="40" height="40" viewBox="0 0 40 40">
    <polygon fill="#FFFFFF" opacity="0.6" points="15.471,20 24.529,20 25,20 25,19 24.529,19 15.471,19 15,19 15,20"/>
  </svg>
  <!-- maximize_normal -->
  <svg x="40" y="0" width="40" height="40" viewBox="0 0 40 40">
    <path fill="#FFFFFF" opacity="0.6" fill-rule="evenodd" d="M15,22.25 L15,17.75 L15,16 L16.8,16 L23.2,16 L25,16 L25,17.75 L25,22.25 L25,24 L23.2,24 L16.8,24 L15,24 L15,22.25 Z M16,23 L24,23 L24,17 L16,17 L16,23 Z"/>
  </svg>
  <!-- unmaximize_normal (restore) -->
  <svg x="80" y="0" width="40" height="40" viewBox="0 0 40 40">
    <path fill="#FFFFFF" opacity="0.6" fill-rule="evenodd" d="M24,16 L16,16 L16,15 L25,15 L25,24 L24,24 L24,16 Z M15,23 L15,19 L15,17 L17,17 L21,17 L23,17 L23,19 L23,23 L23,25 L21,25 L17,25 L15,25 L15,23 Z M16,24 L22,24 L22,18 L16,18 L16,24 Z"/>
  </svg>
  <!-- close_normal -->
  <svg x="120" y="0" width="40" height="40" viewBox="0 0 40 40">
    <polygon fill="#FFFFFF" opacity="0.6" points="20.25,20.958 17.063,24.146 16.708,24.5 16,23.792 16.354,23.438 19.542,20.25 16.354,17.063 16,16.708 16.708,16 17.063,16.354 20.25,19.542 23.438,16.354 23.792,16 24.5,16.708 24.146,17.063 20.958,20.25 24.146,23.438 24.5,23.792 23.792,24.5 23.438,24.146"/>
  </svg>

  <!-- Row 1: Hover state (square highlight #FFFFFF@.15, close turns orange) -->
  <!-- minimize_hover -->
  <svg x="0" y="40" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#FFFFFF" fill-opacity="0.15"/>
    <polygon fill="#FFFFFF" points="15.471,20 24.529,20 25,20 25,19 24.529,19 15.471,19 15,19 15,20"/>
  </svg>
  <!-- maximize_hover -->
  <svg x="40" y="40" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#FFFFFF" fill-opacity="0.15"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M15,22.25 L15,17.75 L15,16 L16.8,16 L23.2,16 L25,16 L25,17.75 L25,22.25 L25,24 L23.2,24 L16.8,24 L15,24 L15,22.25 Z M16,23 L24,23 L24,17 L16,17 L16,23 Z"/>
  </svg>
  <!-- unmaximize_hover -->
  <svg x="80" y="40" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#FFFFFF" fill-opacity="0.15"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M24,16 L16,16 L16,15 L25,15 L25,24 L24,24 L24,16 Z M15,23 L15,19 L15,17 L17,17 L21,17 L23,17 L23,19 L23,23 L23,25 L21,25 L17,25 L15,25 L15,23 Z M16,24 L22,24 L22,18 L16,18 L16,24 Z"/>
  </svg>
  <!-- close_hover (orange) -->
  <svg x="120" y="40" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#FFFFFF" fill-opacity="0.15"/>
    <polygon fill="#F27E00" points="20.243,20.95 17.061,24.132 16.707,24.485 16,23.778 16.354,23.425 19.536,20.243 16.354,17.061 16,16.707 16.707,16 17.061,16.354 20.243,19.536 23.425,16.354 23.778,16 24.485,16.707 24.132,17.061 20.95,20.243 24.132,23.425 24.485,23.778 23.778,24.485 23.425,24.132"/>
  </svg>

  <!-- Row 2: Pressed state (square highlight #000000@.1, blue icons, close pink) -->
  <!-- minimize_press -->
  <svg x="0" y="80" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#000000" fill-opacity="0.1"/>
    <polygon fill="#2CA7F8" points="15.471,20 24.529,20 25,20 25,19 24.529,19 15.471,19 15,19 15,20"/>
  </svg>
  <!-- maximize_press -->
  <svg x="40" y="80" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#000000" fill-opacity="0.1"/>
    <path fill="#2CA7F8" fill-rule="evenodd" d="M15,22.25 L15,17.75 L15,16 L16.8,16 L23.2,16 L25,16 L25,17.75 L25,22.25 L25,24 L23.2,24 L16.8,24 L15,24 L15,22.25 Z M16,23 L24,23 L24,17 L16,17 L16,23 Z"/>
  </svg>
  <!-- unmaximize_press -->
  <svg x="80" y="80" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#000000" fill-opacity="0.1"/>
    <path fill="#2CA7F8" fill-rule="evenodd" d="M24,16 L16,16 L16,15 L25,15 L25,24 L24,24 L24,16 Z M15,23 L15,19 L15,17 L17,17 L21,17 L23,17 L23,19 L23,23 L23,25 L21,25 L17,25 L15,25 L15,23 Z M16,24 L22,24 L22,18 L16,18 L16,24 Z"/>
  </svg>
  <!-- close_press (pink) -->
  <svg x="120" y="80" width="40" height="40" viewBox="0 0 40 40">
    <rect width="40" height="40" fill="#000000" fill-opacity="0.1"/>
    <polygon fill="#FF3763" points="20.243,20.95 17.061,24.132 16.707,24.485 16,23.778 16.354,23.425 19.536,20.243 16.354,17.061 16,16.707 16.707,16 17.061,16.354 20.243,19.536 23.425,16.354 23.778,16 24.485,16.707 24.132,17.061 20.95,20.243 24.132,23.425 24.485,23.778 23.778,24.485 23.425,24.132"/>
  </svg>
</svg>
